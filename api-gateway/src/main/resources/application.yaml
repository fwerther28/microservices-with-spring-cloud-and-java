server:
  port: 8765

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://naming-server:8761/eureka}

  server:
    port: 8000
  eureka:
    client:
      service-url:
        defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  spring:
    application:
      name: exchange-service
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/exchange_service
      username: root
      password: ${DB_PASSWORD:FwDevJava83$}
    jpa:
      hibernate:
        ddl-auto: none
      properties:
        hibernate:
      show-sql: false
      open-in-view: false
  management:
    tracing:
      sampling:
        probability: 1.0
      export:
        zipkin:
          enabled: true
          endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:${SPRING_ZIPKIN_BASEURL:http://localhost:9411}/api/v2/spans}
    zipkin:
      tracing:
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:${SPRING_ZIPKIN_BASEURL:http://localhost:9411}/api/v2/spans}
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
